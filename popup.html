<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>开发匣 · DevBox</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="workspace-switcher.css"><link rel="stylesheet" href="dark-theme.css"><link rel="stylesheet" href="icon-fallback.css"><link rel="stylesheet" href="compare-layout.css"><link rel="stylesheet" href="workspace-search.css">
</head>
<body>
  <header class="topbar"><div class="brand"><img class="brand-mark" src="icon128.png" alt="开发匣"><div><h1>开发匣</h1><p>DevBox · 开发者工具箱</p></div></div><div class="top-actions"><button id="settings" class="icon-btn" title="打开设置">设置</button><button id="open-full" class="icon-btn" title="在新标签页打开完整工作区">打开工作区</button></div></header>
  <div class="privacy">普通工具在本地处理；网络请求仅在你主动运行时发送</div>
  <section id="settings-panel" class="settings-panel hidden" aria-label="开发匣设置"><div><strong>工作区设置</strong><p>设置打开方式和主题，配置保存在本机。</p></div><label class="setting-check"><input id="default-full" type="checkbox">默认打开全页工作区</label><label class="setting-check"><input id="dark-mode" type="checkbox">深色主题</label><button id="manage-tools" class="icon-btn">管理工具</button><button id="close-settings" class="icon-btn">完成</button></section>
  <section id="tool-manager" class="tool-manager hidden" aria-label="工具管理"><div class="tool-manager-head"><strong>工具管理</strong><button id="reset-tools" class="icon-btn">全部启用</button></div><div id="tool-manager-list" class="tool-manager-list"></div></section>
  <main>
    <div class="search-row"><input id="search" placeholder="搜索工具，例如 JSON、Base64、时间…" autocomplete="off"><button id="clear-search" class="clear hidden">×</button></div>
    <nav id="categories" class="categories"></nav>
    <div class="filter-row"><div class="filters"><button class="filter active" data-scope="all">全部</button><button class="filter" data-scope="favorite">收藏</button><button class="filter" data-scope="recent">最近</button></div><button id="sort" class="sort">默认排序</button></div>
    <section id="tool-grid" class="tool-grid"></section>
    <p id="empty" class="empty hidden">没有找到匹配的工具</p>
  </main>
  <section id="workspace" class="workspace hidden">
    <div class="workspace-head"><button id="back" class="back">返回</button><div><h2 id="tool-title"></h2><p id="tool-desc"></p></div><div class="tool-switch-wrap"><input id="tool-switch" class="tool-switch" aria-label="搜索并切换工具" title="输入工具名搜索，↑↓选择，Enter打开" placeholder="搜索工具…" autocomplete="off"><div id="tool-switch-results" class="tool-switch-results hidden"></div></div><button id="favorite-tool" class="star">收藏</button></div>
    <div id="workspace-search" class="workspace-search hidden" role="search"><input id="workspace-search-input" placeholder="搜索当前工具内容" autocomplete="off"><span id="workspace-search-count">0/0</span><button id="workspace-search-prev" title="上一个">↑</button><button id="workspace-search-next" title="下一个">↓</button><button id="workspace-search-close" title="关闭">×</button></div>
    <div id="tool-options" class="tool-options"></div>
    <div id="secondary-wrap" class="secondary-wrap hidden"><div class="pane-head"><label>对比内容</label><button id="secondary-sample">示例</button></div><textarea id="secondary-input" spellcheck="false"></textarea></div>
    <section id="compare-wrap" class="compare-wrap hidden" aria-label="左右对比">
      <div class="compare-grid">
        <div class="pane compare-pane"><div class="pane-head"><label id="compare-left-label">左侧（原始）</label><div><button id="compare-format-left">格式化</button><button id="compare-minify-left">压缩</button><button id="compare-edit-left" class="hidden">编辑</button><button id="compare-paste-left">粘贴</button><button id="compare-import-left">导入</button><button id="compare-sample-left">示例</button></div></div><textarea id="compare-left" spellcheck="false"></textarea><div id="compare-left-view" class="compare-code hidden" aria-label="左侧差异标记"></div></div>
        <button id="compare-swap" class="compare-swap" title="交换左右内容">⇄</button>
        <div class="pane compare-pane"><div class="pane-head"><label id="compare-right-label">右侧（对比）</label><div><button id="compare-format-right">格式化</button><button id="compare-minify-right">压缩</button><button id="compare-edit-right" class="hidden">编辑</button><button id="compare-paste-right">粘贴</button><button id="compare-import-right">导入</button><button id="compare-sample-right">示例</button></div></div><textarea id="compare-right" spellcheck="false"></textarea><div id="compare-right-view" class="compare-code hidden" aria-label="右侧差异标记"></div></div>
      </div>
      <section class="compare-result-pane"><div class="pane-head"><label>差异结果</label><button id="compare-copy">复制结果</button></div><div id="compare-summary" class="compare-summary"></div><div id="compare-result" class="compare-result"></div></section>
    </section>
    <div class="io-grid"><div class="pane"><div class="pane-head"><label id="input-label">输入</label><button id="sample">示例</button></div><textarea id="input" spellcheck="false"></textarea><div class="pane-foot"><button id="paste">粘贴</button><button id="import-input">导入文件</button><button id="clear-input">清空</button></div></div><button id="swap" class="swap" title="交换输入和结果">交换</button><div class="pane output-pane"><div class="pane-head"><label>结果</label><div><button id="copy">复制</button><button id="download-output">下载</button></div></div><textarea id="output" readonly spellcheck="false"></textarea><div id="status" class="status"></div></div></div>
    <input id="file-input" class="hidden" type="file" accept=".txt,.json,.yaml,.yml,.xml,.html,.css,.js,.md,.csv,text/*,application/json">
    <button id="run" class="run">按当前工具处理 <span>Ctrl Enter</span></button>
  </section>
  <footer><span>开发匣 1.0.16</span><span>Ctrl + F 搜索 · ↑↓ 选择 · Enter 打开</span></footer>
  <script src="popup.js"></script><script src="tool-enhancements.js"></script><script src="popup-keyboard.js"></script><script src="paste-auto-run.js"></script><script src="workspace-switcher.js"></script><script src="theme-settings.js"></script><script src="file-import-enhancements.js"></script><script src="icon-fallback.js"></script><script src="compare-actions.js"></script><script src="workspace-search.js"></script>
</body>
</html>
