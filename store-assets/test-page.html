<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>开发匣截图测试页</title>
<style>
  body{max-width:720px;margin:48px auto;padding:0 24px;color:#202633;font:16px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;background:#f7f8fb}
  main{padding:28px;border:1px solid #dfe3eb;border-radius:12px;background:#fff;box-shadow:0 8px 24px #1f29370d}
  button{padding:9px 14px;border:1px solid #cfd5df;border-radius:6px;background:#4f46e5;color:#fff;cursor:pointer}
  pre{padding:12px;border-radius:6px;background:#f1f5f9;overflow:auto}
</style>
<main>
  <h1>开发匣 DevBox 测试页面</h1>
  <p>只用于截取上架截图。页面不会收集或展示真实数据。</p>
  <button id="send">发送脱敏 Fetch 请求</button>
  <pre id="result">点击按钮后触发请求</pre>
</main>
<script>
  const payload = {name:'demo', enabled:true, items:[1,2,3]};
  document.querySelector('#send').onclick = async () => {
    const response = await fetch('/api/demo', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    document.querySelector('#result').textContent = JSON.stringify(await response.json(), null, 2);
  };
  document.querySelector('#send').click();
</script>
